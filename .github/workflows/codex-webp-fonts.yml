name: Codex WebP and font patch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .codex/codex-webp-fonts-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply code-only patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("src/routes/__root.tsx")
          page = Path("src/routes/index.tsx")
          tool_html = Path("public/herramientas/ahorro-potencial/index.html")

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Expected block not found: {label}")
              return text.replace(old, new, 1)

          def sub_once(text, pattern, repl, label):
              text, count = re.subn(pattern, repl, text, count=1)
              if count != 1:
                  raise SystemExit(f"Expected pattern not found: {label}")
              return text

          font_url = "https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
          symbols_url = "https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
          tool_font_url = "https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"

          root_text = root.read_text(encoding="utf-8")
          root_text = replace_once(root_text, 'import appCss from "../styles.css?url";\n', 'import appCss from "../styles.css?url";\n\nconst FONT_STYLESHEET = "' + font_url + '";\nconst MATERIAL_SYMBOLS_STYLESHEET = "' + symbols_url + '";\n', "root font constants")
          root_text = replace_once(
              root_text,
              '    links: [\n      { rel: "stylesheet", href: appCss },\n      { rel: "preconnect", href: "https://fonts.googleapis.com" },\n      { rel: "preconnect", href: "https://fonts.gstatic.com", crossOrigin: "anonymous" },\n      { rel: "stylesheet", href: "' + font_url + '" },\n      { rel: "stylesheet", href: "' + symbols_url + '" },\n    ],',
              '    links: [\n      { rel: "stylesheet", href: appCss },\n      {\n        rel: "preload",\n        as: "image",\n        href: "/1.webp",\n        type: "image/webp",\n        fetchpriority: "high",\n        imagesizes: "(max-width: 768px) 100vw, 50vw",\n      },\n      { rel: "preconnect", href: "https://fonts.googleapis.com" },\n      { rel: "preconnect", href: "https://fonts.gstatic.com", crossOrigin: "anonymous" },\n      { rel: "preload", as: "style", href: FONT_STYLESHEET },\n      { rel: "stylesheet", href: FONT_STYLESHEET, media: "print", onload: "this.media=\'all\'" },\n      { rel: "preload", as: "style", href: MATERIAL_SYMBOLS_STYLESHEET },\n      { rel: "stylesheet", href: MATERIAL_SYMBOLS_STYLESHEET, media: "print", onload: "this.media=\'all\'" },\n    ],',
              "root links",
          )
          root_text = replace_once(root_text, '        <HeadContent />\n', '        <HeadContent />\n        <noscript>\n          <link rel="stylesheet" href={FONT_STYLESHEET} />\n          <link rel="stylesheet" href={MATERIAL_SYMBOLS_STYLESHEET} />\n        </noscript>\n', "root noscript")
          root.write_text(root_text, encoding="utf-8")

          text = page.read_text(encoding="utf-8")
          text = replace_once(text, '// Photos in /public\nconst IMG = (n: number) => `/${n}.jpg`;\nconst LOGO = "/logo.png";', '// Photos in /public\nconst LOGO = "/logo.png";', "remove IMG helper")
          text = sub_once(text, r'              <motion\.img\n                style=\{\{ y: imgY, scale: imgScale \}\}\n                alt="Asesoramiento financiero e hipotecario"\n                className="w-full h-auto object-cover"\n                src=\{IMG\(1\)\}\n                loading="eager"\n                fetchPriority="high"\n              />', '              <picture>\n                <source\n                  srcSet="/1.webp"\n                  type="image/webp"\n                  sizes="(max-width: 768px) 100vw, 50vw"\n                />\n                <motion.img\n                  style={{ y: imgY, scale: imgScale }}\n                  alt="Asesoramiento financiero e hipotecario"\n                  className="w-full h-auto object-cover"\n                  src="/1.jpg"\n                  loading="eager"\n                  fetchPriority="high"\n                />\n              </picture>', "hero image")
          text = sub_once(text, r'                  <motion\.img\n                    src=\{IMG\(x\.img\)\}\n                    loading="lazy"\n                    alt=\{x\.t\}\n                    className="absolute inset-0 w-full h-full object-cover"\n                    initial=\{\{ scale: 1 \}\}\n                    whileHover=\{\{ scale: 1\.06 \}\}\n                    transition=\{\{ duration: 1\.2, ease: easeOutExpo \}\}\n                  />', '                  <picture>\n                    <source\n                      srcSet={`/${x.img}.webp`}\n                      type="image/webp"\n                      sizes="(max-width: 768px) 100vw, 45vw"\n                    />\n                    <motion.img\n                      src={`/${x.img}.jpg`}\n                      loading="lazy"\n                      alt={x.t}\n                      className="absolute inset-0 w-full h-full object-cover"\n                      initial={{ scale: 1 }}\n                      whileHover={{ scale: 1.06 }}\n                      transition={{ duration: 1.2, ease: easeOutExpo }}\n                    />\n                  </picture>', "diagnosis images")
          text = sub_once(text, r'              <motion\.img\n                src=\{IMG\(9\)\}\n                loading="lazy"\n                alt="Método de asesoramiento"\n                className="absolute inset-0 w-full h-full object-cover"\n                initial=\{\{ scale: 1\.1 \}\}\n                whileInView=\{\{ scale: 1 \}\}\n                viewport=\{\{ once: true \}\}\n                transition=\{\{ duration: 1\.4, ease: easeOutExpo \}\}\n              />', '              <picture>\n                <source\n                  srcSet="/9.webp"\n                  type="image/webp"\n                  sizes="(max-width: 768px) 100vw, 45vw"\n                />\n                <motion.img\n                  src="/9.jpg"\n                  loading="lazy"\n                  alt="Método de asesoramiento"\n                  className="absolute inset-0 w-full h-full object-cover"\n                  initial={{ scale: 1.1 }}\n                  whileInView={{ scale: 1 }}\n                  viewport={{ once: true }}\n                  transition={{ duration: 1.4, ease: easeOutExpo }}\n                />\n              </picture>', "method image")
          text = sub_once(text, r'                <motion\.img\n                  alt="José Carlos Hidalgo"\n                  className="w-full h-\[600px\] object-cover"\n                  src=\{IMG\(8\)\}\n                  loading="lazy"\n                  initial=\{\{ scale: 1\.08 \}\}\n                  whileInView=\{\{ scale: 1 \}\}\n                  viewport=\{\{ once: true \}\}\n                  transition=\{\{ duration: 1\.6, ease: easeOutExpo \}\}\n                />', '                <picture>\n                  <source\n                    srcSet="/8.webp"\n                    type="image/webp"\n                    sizes="(max-width: 768px) 100vw, 45vw"\n                  />\n                  <motion.img\n                    alt="José Carlos Hidalgo"\n                    className="w-full h-[600px] object-cover"\n                    src="/8.jpg"\n                    loading="lazy"\n                    initial={{ scale: 1.08 }}\n                    whileInView={{ scale: 1 }}\n                    viewport={{ once: true }}\n                    transition={{ duration: 1.6, ease: easeOutExpo }}\n                  />\n                </picture>', "about image")
          text = replace_once(text, '              <select\n                value={form.topic}\n                onChange={onChange("topic")}\n                className="w-full bg-transparent border-0 border-b border-[#E5E5E5] px-0 py-4 focus:ring-0 focus:border-[#FF6B00] transition-colors outline-none"\n              >', '              <select\n                value={form.topic}\n                onChange={onChange("topic")}\n                aria-label="¿Qué necesitas revisar?"\n                className="w-full bg-transparent border-0 border-b border-[#E5E5E5] px-0 py-4 focus:ring-0 focus:border-[#FF6B00] transition-colors outline-none"\n              >', "select aria label")
          page.write_text(text, encoding="utf-8")

          html = tool_html.read_text(encoding="utf-8")
          html = replace_once(html, '  <title>Calculadora de ahorro potencial | José Carlos Hidalgo</title>\n', '  <title>Calculadora de ahorro potencial | José Carlos Hidalgo</title>\n  <link\n    rel="preload"\n    as="image"\n    href="/1.webp"\n    type="image/webp"\n    fetchpriority="high"\n    imagesizes="(max-width: 768px) 100vw, 50vw"\n  />\n', "tool preload")
          html = replace_once(html, '  <link href="' + tool_font_url + '" rel="stylesheet" />', '  <link rel="preload" as="style" href="' + tool_font_url + '" />\n  <link rel="stylesheet" href="' + tool_font_url + '" media="print" onload="this.media=\'all\'" />\n  <noscript>\n    <link rel="stylesheet" href="' + tool_font_url + '" />\n  </noscript>', "tool font link")
          tool_html.write_text(html, encoding="utf-8")

          root_text = root.read_text(encoding="utf-8")
          text = page.read_text(encoding="utf-8")
          html = tool_html.read_text(encoding="utf-8")
          assert '/1.webp' in root_text and '/1.webp' in html
          assert 'media="print" onload="this.media=\'all\'"' in html
          assert 'media: "print", onload: "this.media=\'all\'"' in root_text
          assert 'aria-label="¿Qué necesitas revisar?"' in text
          assert 'srcSet="/1.webp"' in text
          assert 'srcSet={`/${x.img}.webp`}' in text
          assert 'srcSet="/8.webp"' in text
          assert 'srcSet="/9.webp"' in text
          assert 'src="/1.jpg"' in text and '<picture>' in text[text.index('src="/1.jpg"') - 500:text.index('src="/1.jpg"')]
          assert 'src="/8.jpg"' in text and '<picture>' in text[text.index('src="/8.jpg"') - 500:text.index('src="/8.jpg"')]
          assert 'src="/9.jpg"' in text and '<picture>' in text[text.index('src="/9.jpg"') - 500:text.index('src="/9.jpg"')]
          assert '`/${x.img}.jpg`' in text and '<picture>' in text[text.index('`/${x.img}.jpg`') - 500:text.index('`/${x.img}.jpg`')]
          PY
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit patch and cleanup
        run: |
          rm -f .github/workflows/codex-webp-fonts.yml .codex/codex-webp-fonts-trigger.txt
          git config user.name "codex-app[bot]"
          git config user.email "codex-app[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/routes/__root.tsx public/herramientas/ahorro-potencial/index.html .github/workflows/codex-webp-fonts.yml .codex/codex-webp-fonts-trigger.txt
          git commit -m "Optimize image and font loading" || exit 0
          git push
