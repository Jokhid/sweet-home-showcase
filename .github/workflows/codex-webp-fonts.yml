name: Codex one-time WebP and font patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/codex-webp-fonts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply code-only patch
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new):
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}:\n{old[:220]}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          font_main = "https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
          font_symbols = "https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
          font_tool = "https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"

          root = Path("src/routes/__root.tsx")
          root_text = root.read_text(encoding="utf-8")
          root_text = root_text.replace(
              'import appCss from "../styles.css?url";\n',
              'import appCss from "../styles.css?url";\n\nconst FONT_STYLESHEET = "https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap";\nconst MATERIAL_SYMBOLS_STYLESHEET = "https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap";\n',
              1,
          )
          root_old_links = '''    links: [
      { rel: "stylesheet", href: appCss },
      { rel: "preconnect", href: "https://fonts.googleapis.com" },
      { rel: "preconnect", href: "https://fonts.gstatic.com", crossOrigin: "anonymous" },
      { rel: "stylesheet", href: "https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" },
      { rel: "stylesheet", href: "https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" },
    ],'''
          root_new_links = '''    links: [
      { rel: "stylesheet", href: appCss },
      {
        rel: "preload",
        as: "image",
        href: "/1.webp",
        type: "image/webp",
        fetchPriority: "high",
        imageSizes: "(max-width: 768px) 100vw, 50vw",
      },
      { rel: "preconnect", href: "https://fonts.googleapis.com" },
      { rel: "preconnect", href: "https://fonts.gstatic.com", crossOrigin: "anonymous" },
      { rel: "preload", as: "style", href: FONT_STYLESHEET },
      { rel: "stylesheet", href: FONT_STYLESHEET, media: "print", onload: "this.media='all'" },
      { rel: "preload", as: "style", href: MATERIAL_SYMBOLS_STYLESHEET },
      { rel: "stylesheet", href: MATERIAL_SYMBOLS_STYLESHEET, media: "print", onload: "this.media='all'" },
    ],'''
          if root_old_links not in root_text:
              raise SystemExit("Expected root font links block not found")
          root_text = root_text.replace(root_old_links, root_new_links, 1)
          root_text = root_text.replace(
              '        <HeadContent />\n',
              '        <HeadContent />\n        <noscript>\n          <link rel="stylesheet" href={FONT_STYLESHEET} />\n          <link rel="stylesheet" href={MATERIAL_SYMBOLS_STYLESHEET} />\n        </noscript>\n',
              1,
          )
          root.write_text(root_text, encoding="utf-8")

          page = Path("src/routes/index.tsx")
          text = page.read_text(encoding="utf-8")
          replacements = [
              (
          '''              <motion.img
                style={{ y: imgY, scale: imgScale }}
                alt="Asesoramiento financiero e hipotecario"
                className="w-full h-auto object-cover"
                src={IMG(1)}
                loading="eager"
                fetchPriority="high"
              />''',
          '''              <picture>
                <source
                  srcSet="/1.webp"
                  type="image/webp"
                  sizes="(max-width: 768px) 100vw, 50vw"
                />
                <motion.img
                  style={{ y: imgY, scale: imgScale }}
                  alt="Asesoramiento financiero e hipotecario"
                  className="w-full h-auto object-cover"
                  src="/1.jpg"
                  loading="eager"
                  fetchPriority="high"
                />
              </picture>''',
              ),
              (
          '''                  <motion.img
                    src={IMG(x.img)}
                    loading="lazy"
                    alt={x.t}
                    className="absolute inset-0 w-full h-full object-cover"
                    initial={{ scale: 1 }}
                    whileHover={{ scale: 1.06 }}
                    transition={{ duration: 1.2, ease: easeOutExpo }}
                  />''',
          '''                  <picture>
                    <source
                      srcSet={`/${x.img}.webp`}
                      type="image/webp"
                      sizes="(max-width: 768px) 100vw, 45vw"
                    />
                    <motion.img
                      src={IMG(x.img)}
                      loading="lazy"
                      alt={x.t}
                      className="absolute inset-0 w-full h-full object-cover"
                      initial={{ scale: 1 }}
                      whileHover={{ scale: 1.06 }}
                      transition={{ duration: 1.2, ease: easeOutExpo }}
                    />
                  </picture>''',
              ),
              (
          '''              <motion.img
                src={IMG(9)}
                loading="lazy"
                alt="Método de asesoramiento"
                className="absolute inset-0 w-full h-full object-cover"
                initial={{ scale: 1.1 }}
                whileInView={{ scale: 1 }}
                viewport={{ once: true }}
                transition={{ duration: 1.4, ease: easeOutExpo }}
              />''',
          '''              <picture>
                <source
                  srcSet="/9.webp"
                  type="image/webp"
                  sizes="(max-width: 768px) 100vw, 45vw"
                />
                <motion.img
                  src={IMG(9)}
                  loading="lazy"
                  alt="Método de asesoramiento"
                  className="absolute inset-0 w-full h-full object-cover"
                  initial={{ scale: 1.1 }}
                  whileInView={{ scale: 1 }}
                  viewport={{ once: true }}
                  transition={{ duration: 1.4, ease: easeOutExpo }}
                />
              </picture>''',
              ),
              (
          '''                <motion.img
                  alt="José Carlos Hidalgo"
                  className="w-full h-[600px] object-cover"
                  src={IMG(8)}
                  loading="lazy"
                  initial={{ scale: 1.08 }}
                  whileInView={{ scale: 1 }}
                  viewport={{ once: true }}
                  transition={{ duration: 1.6, ease: easeOutExpo }}
                />''',
          '''                <picture>
                  <source
                    srcSet="/8.webp"
                    type="image/webp"
                    sizes="(max-width: 768px) 100vw, 45vw"
                  />
                  <motion.img
                    alt="José Carlos Hidalgo"
                    className="w-full h-[600px] object-cover"
                    src={IMG(8)}
                    loading="lazy"
                    initial={{ scale: 1.08 }}
                    whileInView={{ scale: 1 }}
                    viewport={{ once: true }}
                    transition={{ duration: 1.6, ease: easeOutExpo }}
                  />
                </picture>''',
              ),
              (
          '''              <select
                value={form.topic}
                onChange={onChange("topic")}
                className="w-full bg-transparent border-0 border-b border-[#E5E5E5] px-0 py-4 focus:ring-0 focus:border-[#FF6B00] transition-colors outline-none"
              >''',
          '''              <select
                value={form.topic}
                onChange={onChange("topic")}
                aria-label="¿Qué necesitas revisar?"
                className="w-full bg-transparent border-0 border-b border-[#E5E5E5] px-0 py-4 focus:ring-0 focus:border-[#FF6B00] transition-colors outline-none"
              >''',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected index.tsx block not found:\n{old[:220]}")
              text = text.replace(old, new, 1)
          page.write_text(text, encoding="utf-8")

          tool_html = Path("public/herramientas/ahorro-potencial/index.html")
          html = tool_html.read_text(encoding="utf-8")
          html = html.replace(
              '  <title>Calculadora de ahorro potencial | José Carlos Hidalgo</title>\n',
              '  <title>Calculadora de ahorro potencial | José Carlos Hidalgo</title>\n  <link\n    rel="preload"\n    as="image"\n    href="/1.webp"\n    type="image/webp"\n    fetchpriority="high"\n    imagesizes="(max-width: 768px) 100vw, 50vw"\n  />\n',
              1,
          )
          old_font = '  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />'
          new_font = '''  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  </noscript>'''
          if old_font not in html:
              raise SystemExit("Expected tool Google Fonts link not found")
          html = html.replace(old_font, new_font, 1)
          tool_html.write_text(html, encoding="utf-8")

          # Code-level verification before build.
          root_text = root.read_text(encoding="utf-8")
          text = page.read_text(encoding="utf-8")
          html = tool_html.read_text(encoding="utf-8")
          assert '/1.webp' in root_text and '/1.webp' in html
          assert 'media="print" onload="this.media=\'all\'"' in html
          assert 'media: "print", onload: "this.media=\'all\'"' in root_text
          assert 'aria-label="¿Qué necesitas revisar?"' in text
          assert 'srcSet="/1.webp"' in text
          assert 'srcSet={`/${x.img}.webp`}' in text
          assert 'srcSet="/8.webp"' in text
          assert 'srcSet="/9.webp"' in text
          for target in ('src="/1.jpg"', 'src="/2.jpg"', 'src="/3.jpg"', 'src="/4.jpg"', 'src="/8.jpg"', 'src="/9.jpg"'):
              if target in text and '<picture>' not in text[max(0, text.index(target)-500):text.index(target)]:
                  raise AssertionError(f"Direct jpg target outside picture: {target}")
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/codex-webp-fonts.yml
          git config user.name "codex-app[bot]"
          git config user.email "codex-app[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/routes/__root.tsx public/herramientas/ahorro-potencial/index.html .github/workflows/codex-webp-fonts.yml
          git commit -m "Optimize image and font loading" || exit 0
          git push
