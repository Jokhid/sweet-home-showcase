name: Integrate tools section into React

on:
  push:
    paths:
      - ".github/workflows/integrate-tools-react.yml"

permissions:
  contents: write

jobs:
  integrate-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Patch home and helper script
        shell: python
        run: |
          from pathlib import Path

          index_path = Path("src/routes/index.tsx")
          index = index_path.read_text(encoding="utf-8")

          if "<Tools />" not in index:
              index = index.replace(
                  "        <FAQ />\n        <Contact />",
                  "        <FAQ />\n        <Tools />\n        <Contact />",
              )

          if '["Herramientas", "/#herramientas"],' not in index:
              index = index.replace(
                  '    ["FAQ", "/#faq"],\n    ["Contacto", "/#contact"],',
                  '    ["FAQ", "/#faq"],\n    ["Herramientas", "/#herramientas"],\n    ["Contacto", "/#contact"],',
              )

          tools_component = r'''

type ToolIconName = "savings" | "health_and_safety" | "real_estate_agent" | "arrow_forward";

const toolCards: Array<{
  icon: ToolIconName;
  title: string;
  text: string;
  action: string;
  href?: string;
}> = [
  {
    icon: "savings",
    title: "Calculadora de ahorro potencial",
    text: "Calcula cuánto dinero se escapa en pequeños gastos recurrentes y visualiza tu ahorro anual recuperable.",
    action: "Abrir calculadora",
    href: "/herramientas/ahorro-potencial/",
  },
  {
    icon: "health_and_safety",
    title: "Test de vulnerabilidad financiera",
    text: "Detecta puntos débiles en ingresos, protección y planificación para saber dónde conviene actuar primero.",
    action: "Próximamente",
  },
  {
    icon: "real_estate_agent",
    title: "Calculadora hipotecaria",
    text: "Estima cuota, intereses y escenarios de financiación para valorar una hipoteca con más criterio.",
    action: "Próximamente",
  },
];

function ToolSvg({ name }: { name: ToolIconName }) {
  const common = {
    viewBox: "0 0 24 24",
    fill: "none",
    stroke: "currentColor",
    strokeWidth: 2,
    strokeLinecap: "round" as const,
    strokeLinejoin: "round" as const,
  };

  if (name === "savings") {
    return (
      <svg {...common}>
        <path d="M5 11a7 7 0 0 1 14 0c0 5-7 10-7 10s-7-5-7-10Z" />
        <path d="M12 8v6" />
        <path d="M9.5 10.5h3.25a1.75 1.75 0 0 1 0 3.5H10" />
        <path d="M16.5 5.5 18 3" />
        <path d="M7.5 5.5 6 3" />
      </svg>
    );
  }

  if (name === "health_and_safety") {
    return (
      <svg {...common}>
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />
        <path d="M12 7v8" />
        <path d="M8 11h8" />
      </svg>
    );
  }

  if (name === "real_estate_agent") {
    return (
      <svg {...common}>
        <path d="m3 11 9-8 9 8" />
        <path d="M5 10v10h14V10" />
        <path d="M9 20v-6h6v6" />
      </svg>
    );
  }

  return (
    <svg {...common} strokeWidth={2.5}>
      <path d="M5 12h14" />
      <path d="m13 6 6 6-6 6" />
    </svg>
  );
}

function Tools() {
  return (
    <section id="herramientas" className="bg-white border-t border-[#E5E5E5] text-[#1A1A1A] py-[100px]">
      <div className="max-w-[1200px] mx-auto px-6">
        <FadeUp>
          <p className="text-[#C5A566] text-xs font-black uppercase tracking-[0.22em] mb-6">Herramientas</p>
        </FadeUp>
        <div className="max-w-4xl">
          <h2 className="text-[clamp(2.35rem,5vw,4.6rem)] leading-[0.95] font-black tracking-tight">
            <Curtain>
              Herramientas para <span className="text-[#C5A566]">decidir con números</span>, no por intuición
            </Curtain>
          </h2>
          <FadeUp delay={0.1}>
            <p className="max-w-3xl mt-7 mb-18 text-[#4A4A4A] text-lg md:text-xl leading-relaxed">
              Recursos prácticos para medir ahorro, vulnerabilidad financiera y escenarios hipotecarios antes de tomar decisiones importantes.
            </p>
          </FadeUp>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-px bg-[#E5E5E5] border border-[#E5E5E5]">
          {toolCards.map((tool, index) => {
            const content = (
              <>
                <span className="w-11 h-11 inline-flex items-center justify-center text-[#C5A566] mb-8" aria-hidden="true">
                  <ToolSvg name={tool.icon} />
                </span>
                <h3 className="m-0 mb-[18px] text-[26px] leading-[1.08] font-black tracking-tight">{tool.title}</h3>
                <p className="m-0 mb-9 text-[#4A4A4A] text-base leading-relaxed transition-colors group-hover:text-white/75">{tool.text}</p>
                <span className="mt-auto inline-flex items-center gap-2 text-xs font-black uppercase tracking-[0.18em]">
                  {tool.action}
                  {tool.href ? (
                    <span className="w-4 h-4 inline-flex" aria-hidden="true">
                      <ToolSvg name="arrow_forward" />
                    </span>
                  ) : null}
                </span>
              </>
            );

            return (
              <FadeUp key={tool.title} delay={index * 0.08}>
                {tool.href ? (
                  <a
                    className="group min-h-[360px] flex flex-col items-start bg-white text-[#1A1A1A] p-10 no-underline transition-all duration-300 hover:bg-[#1A1A1A] hover:text-white hover:-translate-y-1"
                    href={tool.href}
                  >
                    {content}
                  </a>
                ) : (
                  <article className="min-h-[360px] flex flex-col items-start bg-white text-[#1A1A1A] p-10" aria-disabled="true">
                    {content}
                  </article>
                )}
              </FadeUp>
            );
          })}
        </div>
      </div>
    </section>
  );
}
'''

          if "function Tools()" not in index:
              marker = "\nfunction Contact() {"
              if marker not in index:
                  raise SystemExit("No se encontró function Contact() para insertar Tools")
              index = index.replace(marker, tools_component + marker, 1)

          if 'aria-label="¿Qué necesitas revisar?"' not in index:
              index = index.replace(
                  "              <select\n                value={form.topic}",
                  "              <select\n                aria-label=\"¿Qué necesitas revisar?\"\n                value={form.topic}",
                  1,
              )

          index_path.write_text(index, encoding="utf-8")

          helper_path = Path("public/herramientas-home.js")
          helper = helper_path.read_text(encoding="utf-8")
          helper = helper.replace("    ensureToolsNav();\n    ensureToolsSection();\n", "")
          observer_block = """\n\n    if (!window.__jcToolsObserver) {\n      window.__jcToolsObserver = new MutationObserver(queueEnhance);\n      window.__jcToolsObserver.observe(document.body, { childList: true, subtree: true });\n    }"""
          helper = helper.replace(observer_block, "")
          helper_path.write_text(helper, encoding="utf-8")

          Path(".github/workflows/integrate-tools-react.yml").unlink(missing_ok=True)

      - name: Validate changes
        run: |
          grep -q '<Tools />' src/routes/index.tsx
          grep -q 'function Tools()' src/routes/index.tsx
          grep -q '\["Herramientas", "/#herramientas"\]' src/routes/index.tsx
          ! grep -q 'ensureToolsNav();' public/herramientas-home.js
          ! grep -q 'ensureToolsSection();' public/herramientas-home.js

      - name: Commit integration
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          git add src/routes/index.tsx public/herramientas-home.js .github/workflows/integrate-tools-react.yml
          git commit -m "Integrate tools section into React [skip ci]"
          git push
