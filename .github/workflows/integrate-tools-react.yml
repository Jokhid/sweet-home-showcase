name: Integrate tools into React

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/integrate-tools-react.yml"
      - ".github/integrate-tools-trigger.txt"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Integrate tools section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path("src/routes/index.tsx")
          text = index_path.read_text(encoding="utf-8")

          text = text.replace(
              "        <FAQ />\n        <Contact />",
              "        <FAQ />\n        <Tools />\n        <Contact />",
              1,
          )
          text = text.replace(
              '    ["FAQ", "/#faq"],\n    ["Contacto", "/#contact"],',
              '    ["FAQ", "/#faq"],\n    ["Herramientas", "/#herramientas"],\n    ["Contacto", "/#contact"],',
              1,
          )
          text = text.replace(
              "              <select\n                value={form.topic}",
              "              <select\n                aria-label=\"¿Qué necesitas revisar?\"\n                value={form.topic}",
              1,
          )

          tools_component = r'''

type ToolIconName = "savings" | "health_and_safety" | "real_estate_agent" | "arrow_forward";

const toolCards: Array<{
  icon: ToolIconName;
  title: string;
  text: string;
  action: string;
  href?: string;
}> = [
  {
    icon: "savings",
    title: "Calculadora de ahorro potencial",
    text: "Calcula cuánto dinero se escapa en pequeños gastos recurrentes y visualiza tu ahorro anual recuperable.",
    action: "Abrir calculadora",
    href: "/herramientas/ahorro-potencial/",
  },
  {
    icon: "health_and_safety",
    title: "Test de vulnerabilidad financiera",
    text: "Detecta puntos débiles en ingresos, protección y planificación para saber dónde conviene actuar primero.",
    action: "Próximamente",
  },
  {
    icon: "real_estate_agent",
    title: "Calculadora hipotecaria",
    text: "Estima cuota, intereses y escenarios de financiación para valorar una hipoteca con más criterio.",
    action: "Próximamente",
  },
];

function ToolSvg({ name }: { name: ToolIconName }) {
  if (name === "savings") {
    return (
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" className="h-7 w-7">
        <path d="M7 11.5c0-3 2.7-5.5 6-5.5s6 2.5 6 5.5S16.3 17 13 17H8.5A3.5 3.5 0 0 1 5 13.5" />
        <path d="M6 13H3" />
        <path d="M17.5 7.5 20 5" />
        <path d="M9 17v3" />
        <path d="M16 17v3" />
        <path d="M10 10h.01" />
      </svg>
    );
  }

  if (name === "health_and_safety") {
    return (
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" className="h-7 w-7">
        <path d="M12 3 5 6v5c0 4.6 2.9 8.6 7 10 4.1-1.4 7-5.4 7-10V6l-7-3Z" />
        <path d="M12 8v8" />
        <path d="M8 12h8" />
      </svg>
    );
  }

  if (name === "real_estate_agent") {
    return (
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" className="h-7 w-7">
        <path d="M3 11 12 4l9 7" />
        <path d="M5 10v10h14V10" />
        <path d="M9 20v-6h6v6" />
        <path d="M16 7.5h3V11" />
      </svg>
    );
  }

  return (
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round" className="h-5 w-5">
      <path d="M5 12h14" />
      <path d="m13 6 6 6-6 6" />
    </svg>
  );
}

function Tools() {
  return (
    <section id="herramientas" className="bg-white border-t border-[#E5E5E5] text-[#1A1A1A] py-[100px] scroll-mt-28">
      <div className="max-w-[1200px] mx-auto px-6">
        <FadeUp>
          <p className="text-[#C5A566] text-xs font-black uppercase tracking-[0.22em] mb-6">Herramientas</p>
        </FadeUp>
        <div className="max-w-4xl">
          <h2 className="text-[clamp(2.35rem,5vw,4.6rem)] leading-[0.95] font-black tracking-tight">
            <Curtain>
              Herramientas para <span className="text-[#C5A566]">decidir con números</span>, no por intuición
            </Curtain>
          </h2>
          <FadeUp delay={0.1}>
            <p className="max-w-3xl mt-7 mb-[72px] text-[#4A4A4A] text-lg md:text-xl leading-relaxed">
              Recursos prácticos para medir ahorro, vulnerabilidad financiera y escenarios hipotecarios antes de tomar decisiones importantes.
            </p>
          </FadeUp>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-3 gap-px bg-[#E5E5E5] border border-[#E5E5E5]">
          {toolCards.map((tool, index) => {
            const content = (
              <>
                <div className="mb-10 flex h-14 w-14 items-center justify-center bg-[#1A1A1A] text-white transition-colors duration-500 group-hover:bg-[#C5A566]">
                  <ToolSvg name={tool.icon} />
                </div>
                <p className="mb-4 text-[10px] font-black uppercase tracking-[0.22em] text-[#C5A566]">{String(index + 1).padStart(2, "0")}</p>
                <h3 className="mb-5 text-3xl font-black leading-[0.98] tracking-tight text-[#1A1A1A] transition-colors duration-500 group-hover:text-white">
                  {tool.title}
                </h3>
                <p className="mb-10 text-base leading-relaxed text-[#4A4A4A] transition-colors duration-500 group-hover:text-white/80">
                  {tool.text}
                </p>
                <span className="mt-auto inline-flex items-center gap-3 text-xs font-black uppercase tracking-[0.2em] text-[#1A1A1A] transition-colors duration-500 group-hover:text-white">
                  {tool.action}
                  <ToolSvg name="arrow_forward" />
                </span>
              </>
            );

            return (
              <FadeUp key={tool.title} delay={index * 0.08}>
                {tool.href ? (
                  <motion.a
                    href={tool.href}
                    whileHover={{ y: -6 }}
                    transition={spring}
                    className="group flex min-h-[420px] flex-col bg-white p-8 transition-colors duration-500 hover:bg-[#1A1A1A]"
                  >
                    {content}
                  </motion.a>
                ) : (
                  <motion.div
                    whileHover={{ y: -6 }}
                    transition={spring}
                    className="group flex min-h-[420px] flex-col bg-white p-8 transition-colors duration-500 hover:bg-[#1A1A1A]"
                  >
                    {content}
                  </motion.div>
                )}
              </FadeUp>
            );
          })}
        </div>
      </div>
    </section>
  );
}
'''

          marker = "\nfunction Contact() {"
          if "function Tools()" not in text:
              text = text.replace(marker, tools_component + marker, 1)

          if '<Tools />' not in text:
              raise SystemExit("Tools component was not mounted")
          if '["Herramientas", "/#herramientas"]' not in text:
              raise SystemExit("Tools nav link was not added")
          if 'aria-label="¿Qué necesitas revisar?"' not in text:
              raise SystemExit("Select aria-label was not added")
          if "function Tools()" not in text:
              raise SystemExit("Tools component was not inserted")

          index_path.write_text(text, encoding="utf-8")

          helper_path = Path("public/herramientas-home.js")
          helper = helper_path.read_text(encoding="utf-8")
          helper = helper.replace("  ensureToolsNav();\n", "")
          helper = helper.replace("  ensureToolsSection();\n", "")
          if "\n  ensureToolsNav();" in helper or "\n  ensureToolsSection();" in helper:
              raise SystemExit("Tools injection calls are still present")
          helper_path.write_text(helper, encoding="utf-8")
          PY

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        shell: bash
        run: npm run build

      - name: Commit integrated change
        shell: bash
        run: |
          rm -f .github/workflows/integrate-tools-react.yml .github/integrate-tools-trigger.txt
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add src/routes/index.tsx public/herramientas-home.js .github/workflows/integrate-tools-react.yml .github/integrate-tools-trigger.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Integrate tools section into React [skip ci]"
            git push
          fi
