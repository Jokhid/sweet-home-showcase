name: Codex performance patch

on:
  workflow_dispatch:
  push:
    paths:
      - '.codex/performance-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply performance changes
        run: |
          node <<'NODE'
          const fs = require('fs');

          const read = (file) => fs.readFileSync(file, 'utf8');
          const write = (file, content) => fs.writeFileSync(file, content);
          const replaceOnce = (content, search, replacement, label) => {
            if (!content.includes(search)) throw new Error(`Missing block: ${label}`);
            return content.replace(search, replacement);
          };

          const fontPrimary = 'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap';
          const fontIcons = 'https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap';
          const toolFont = 'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0';

          let root = read('src/routes/__root.tsx');
          root = replaceOnce(
            root,
            'import appCss from "../styles.css?url";\n',
            `import appCss from "../styles.css?url";\n\nconst FONT_PRIMARY = "${fontPrimary}";\nconst FONT_ICONS = "${fontIcons}";\n`,
            'font constants'
          );
          root = replaceOnce(
            root,
            `    links: [\n      { rel: "stylesheet", href: appCss },\n      { rel: "preconnect", href: "https://fonts.googleapis.com" },\n      { rel: "preconnect", href: "https://fonts.gstatic.com", crossOrigin: "anonymous" },\n      { rel: "stylesheet", href: "${fontPrimary}" },\n      { rel: "stylesheet", href: "${fontIcons}" },\n    ],`,
            `    links: [\n      { rel: "stylesheet", href: appCss },\n      {\n        rel: "preload",\n        as: "image",\n        href: "/1.webp",\n        type: "image/webp",\n        fetchpriority: "high",\n        imagesizes: "(max-width: 768px) 100vw, 50vw",\n      },\n      { rel: "preconnect", href: "https://fonts.googleapis.com" },\n      { rel: "preconnect", href: "https://fonts.gstatic.com", crossOrigin: "anonymous" },\n      { rel: "preload", as: "style", href: FONT_PRIMARY },\n      { rel: "stylesheet", href: FONT_PRIMARY, media: "print", onload: "this.media='all'" },\n      { rel: "preload", as: "style", href: FONT_ICONS },\n      { rel: "stylesheet", href: FONT_ICONS, media: "print", onload: "this.media='all'" },\n    ],`,
            'root links'
          );
          root = replaceOnce(
            root,
            `      <head>\n        <HeadContent />\n      </head>`,
            `      <head>\n        <HeadContent />\n        <noscript>\n          <link rel="stylesheet" href={FONT_PRIMARY} />\n          <link rel="stylesheet" href={FONT_ICONS} />\n        </noscript>\n      </head>`,
            'root noscript fonts'
          );
          write('src/routes/__root.tsx', root);

          let page = read('src/routes/index.tsx');
          page = replaceOnce(
            page,
            '// Photos in /public\nconst IMG = (n: number) => `/${n}.webp`;\nconst LOGO = "/logo.png";',
            '// Photos in /public\nconst LOGO = "/logo.png";',
            'remove IMG helper'
          );
          page = replaceOnce(
            page,
            `              <motion.img\n                style={{ y: imgY, scale: imgScale }}\n                alt="Asesoramiento financiero e hipotecario"\n                className="w-full h-auto object-cover"\n                src={IMG(1)}\n                loading="eager"\n                fetchPriority="high"\n              />`,
            `              <picture>\n                <source\n                  srcSet="/1.webp"\n                  type="image/webp"\n                  sizes="(max-width: 768px) 100vw, 50vw"\n                />\n                <motion.img\n                  style={{ y: imgY, scale: imgScale }}\n                  alt="Asesoramiento financiero e hipotecario"\n                  className="w-full h-auto object-cover"\n                  src="/1.jpg"\n                  loading="eager"\n                  fetchPriority="high"\n                />\n              </picture>`,
            'hero picture'
          );
          page = replaceOnce(
            page,
            `                  <motion.img\n                    src={IMG(x.img)}\n                    loading="lazy"\n                    alt={x.t}\n                    className="absolute inset-0 w-full h-full object-cover"\n                    initial={{ scale: 1 }}\n                    whileHover={{ scale: 1.06 }}\n                    transition={{ duration: 1.2, ease: easeOutExpo }}\n                  />`,
            `                  <picture>\n                    <source\n                      srcSet={\`/${x.img}.webp\`}\n                      type="image/webp"\n                      sizes="(max-width: 768px) 100vw, 45vw"\n                    />\n                    <motion.img\n                      src={\`/${x.img}.jpg\`}\n                      loading="lazy"\n                      alt={x.t}\n                      className="absolute inset-0 w-full h-full object-cover"\n                      initial={{ scale: 1 }}\n                      whileHover={{ scale: 1.06 }}\n                      transition={{ duration: 1.2, ease: easeOutExpo }}\n                    />\n                  </picture>`,
            'diagnosis pictures'
          );
          page = replaceOnce(
            page,
            `              <motion.img\n                src={IMG(9)}\n                loading="lazy"\n                alt="Método de asesoramiento"\n                className="absolute inset-0 w-full h-full object-cover"\n                initial={{ scale: 1.1 }}\n                whileInView={{ scale: 1 }}\n                viewport={{ once: true }}\n                transition={{ duration: 1.4, ease: easeOutExpo }}\n              />`,
            `              <picture>\n                <source\n                  srcSet="/9.webp"\n                  type="image/webp"\n                  sizes="(max-width: 768px) 100vw, 45vw"\n                />\n                <motion.img\n                  src="/9.jpg"\n                  loading="lazy"\n                  alt="Método de asesoramiento"\n                  className="absolute inset-0 w-full h-full object-cover"\n                  initial={{ scale: 1.1 }}\n                  whileInView={{ scale: 1 }}\n                  viewport={{ once: true }}\n                  transition={{ duration: 1.4, ease: easeOutExpo }}\n                />\n              </picture>`,
            'method picture'
          );
          page = replaceOnce(
            page,
            `                <motion.img\n                  alt="José Carlos Hidalgo"\n                  className="w-full h-[600px] object-cover"\n                  src={IMG(8)}\n                  loading="lazy"\n                  initial={{ scale: 1.08 }}\n                  whileInView={{ scale: 1 }}\n                  viewport={{ once: true }}\n                  transition={{ duration: 1.6, ease: easeOutExpo }}\n                />`,
            `                <picture>\n                  <source\n                    srcSet="/8.webp"\n                    type="image/webp"\n                    sizes="(max-width: 768px) 100vw, 45vw"\n                  />\n                  <motion.img\n                    alt="José Carlos Hidalgo"\n                    className="w-full h-[600px] object-cover"\n                    src="/8.jpg"\n                    loading="lazy"\n                    initial={{ scale: 1.08 }}\n                    whileInView={{ scale: 1 }}\n                    viewport={{ once: true }}\n                    transition={{ duration: 1.6, ease: easeOutExpo }}\n                  />\n                </picture>`,
            'about picture'
          );
          page = replaceOnce(
            page,
            `              <select\n                value={form.topic}\n                onChange={onChange("topic")}\n                className="w-full bg-transparent border-0 border-b border-[#E5E5E5] px-0 py-4 focus:ring-0 focus:border-[#FF6B00] transition-colors outline-none"\n              >`,
            `              <select\n                value={form.topic}\n                onChange={onChange("topic")}\n                aria-label="¿Qué necesitas revisar?"\n                className="w-full bg-transparent border-0 border-b border-[#E5E5E5] px-0 py-4 focus:ring-0 focus:border-[#FF6B00] transition-colors outline-none"\n              >`,
            'select aria-label'
          );
          if (page.includes('IMG(')) throw new Error('IMG helper references remain');
          write('src/routes/index.tsx', page);

          let tool = read('public/herramientas/ahorro-potencial/index.html');
          tool = replaceOnce(
            tool,
            '  <title>Calculadora de ahorro potencial | José Carlos Hidalgo</title>\n',
            '  <title>Calculadora de ahorro potencial | José Carlos Hidalgo</title>\n  <link\n    rel="preload"\n    as="image"\n    href="/1.webp"\n    type="image/webp"\n    fetchpriority="high"\n    imagesizes="(max-width: 768px) 100vw, 50vw"\n  />\n',
            'tool hero preload'
          );
          tool = replaceOnce(
            tool,
            `  <link href="${toolFont}" rel="stylesheet" />`,
            `  <link rel="preload" as="style" href="${toolFont}" />\n  <link rel="stylesheet" href="${toolFont}" media="print" onload="this.media='all'" />\n  <noscript>\n    <link rel="stylesheet" href="${toolFont}" />\n  </noscript>`,
            'tool async fonts'
          );
          write('public/herramientas/ahorro-potencial/index.html', tool);

          const checks = [
            [root.includes('href: "/1.webp"'), 'root preload /1.webp'],
            [root.includes('media: "print", onload: "this.media=\'all\'"'), 'root async fonts'],
            [page.includes('<picture>') && page.includes('srcSet="/1.webp"') && page.includes('src="/1.jpg"'), 'hero picture'],
            [page.includes('srcSet={`/'), 'dynamic webp sources'],
            [page.includes('aria-label="¿Qué necesitas revisar?"'), 'select aria-label'],
            [tool.includes('href="/1.webp"'), 'tool preload /1.webp'],
            [tool.includes('media="print" onload="this.media=\'all\'"'), 'tool async fonts'],
          ];
          for (const [ok, label] of checks) {
            if (!ok) throw new Error(`Verification failed: ${label}`);
          }
          NODE
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit changes and cleanup
        run: |
          rm -f .github/workflows/codex-performance.yml .codex/performance-trigger.txt
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add src/routes/index.tsx src/routes/__root.tsx public/herramientas/ahorro-potencial/index.html .github/workflows/codex-performance.yml .codex/performance-trigger.txt
          git commit -m "Improve mobile performance loading"
          git push
